<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ISH — 7 Gün Demo</title><link rel="stylesheet" href="styles.css"></head>
<body><header class="topbar"><h1>ISH <span class="tag">7 Gün Ücretsiz Demo</span></h1></header><main class="grid"><section class="card wide"><h2>Demo Başlat</h2><p>Demo lisansı 7 gün geçerlidir ve HWID'nize bağlanır. Süre sunucu tarafından doğrulanır.</p><label>E-posta <input id="email" type="email" autocomplete="email"></label><label>HWID <input id="hwid" placeholder="Kurulumdaki HWID"></label><button id="start">7 Günlük Demo Başlat</button><pre id="out" class="mono"></pre></section><section class="card wide"><h2>Demo Kontrol</h2><textarea id="token" rows="5" style="width:100%" placeholder="ISH-D1...."></textarea><button id="verify">Doğrula</button><pre id="verifyOut" class="mono"></pre><p id="purchase">Demo süresi bittiğinde <a href="/buy.html">lisans satın alma</a> sayfasına geçebilirsiniz.</p></section></main><script>
const $=id=>document.getElementById(id);const customerId=crypto.randomUUID();
$('start').onclick=async()=>{const email=$('email').value.trim(),hwid=$('hwid').value.trim();if(!email||!hwid){$('out').textContent='E-posta ve HWID gerekli';return;}const r=await fetch('/api/demo/7-day',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customerId,email,hwid})});const d=await r.json();$('out').textContent=JSON.stringify(d,null,2);if(d.token)$('token').value=d.token;};
$('verify').onclick=async()=>{const r=await fetch('/api/demo/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:$('token').value.trim(),hwid:$('hwid').value.trim()})});$('verifyOut').textContent=JSON.stringify(await r.json(),null,2);};
</script></body></html>
