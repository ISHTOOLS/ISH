<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ISHv4 Threat Intelligence</title><style>body{font-family:system-ui,sans-serif;margin:24px;background:#0b1020;color:#e7eaf0}button,input{padding:8px;margin:4px}pre{white-space:pre-wrap;background:#121a2e;padding:16px;border-radius:8px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #334;padding:6px;text-align:left}</style></head><body><h1>ISHv4 Threat Intelligence Fabric</h1><p>Real observed telemetry only. No simulated attack data is rendered.</p><label>Bearer token <input id="token" type="password" autocomplete="off"></label><button onclick="load()">Load intelligence</button><div id="out"></div><script>async function load(){const t=document.getElementById('token').value;const h={Authorization:'Bearer '+t};const [s,p,c,i,e]=await Promise.all(['/api/threat-intel/stats','/api/threat-intel/profiles?limit=25','/api/threat-intel/campaigns?limit=25','/api/threat-intel/iocs?limit=50','/api/threat-intel/events?limit=50'].map(u=>fetch(u,{headers:h}).then(r=>r.json())));document.getElementById('out').innerHTML='<h2>Stats</h2><pre>'+esc(JSON.stringify(s.stats,null,2))+'</pre><h2>Top attacker profiles</h2><pre>'+esc(JSON.stringify(p.profiles,null,2))+'</pre><h2>Campaigns</h2><pre>'+esc(JSON.stringify(c.campaigns,null,2))+'</pre><h2>IOCs</h2><pre>'+esc(JSON.stringify(i.iocs,null,2))+'</pre><h2>Recent events</h2><pre>'+esc(JSON.stringify(e.events,null,2))+'</pre>'}function esc(x){return x.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}</script></body></html>
