name: Commercial Finalization Validation

on:
  push:
    branches: [main]
    paths:
      - 'commercial-extensions/**'
      - 'tests/commercial-finalization.test.js'
      - '.github/workflows/commercial-finalization-validation.yml'
  pull_request:
    paths:
      - 'commercial-extensions/**'
      - 'tests/commercial-finalization.test.js'
      - '.github/workflows/commercial-finalization-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --check commercial-extensions/sales-config.js
      - run: node --check commercial-extensions/iban-payment.js
      - run: node --test tests/commercial-finalization.test.js
