name: Multi-Currency Commercial Validation

on:
  pull_request:
    paths:
      - 'commercial-extensions/**'
      - 'tests/multicurrency-github-license.test.js'
      - 'public/buy.html'
      - '.github/workflows/multicurrency-commercial-validation.yml'
  push:
    branches: [main]
    paths:
      - 'commercial-extensions/**'
      - 'tests/multicurrency-github-license.test.js'
      - 'public/buy.html'
      - '.github/workflows/multicurrency-commercial-validation.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --check commercial-extensions/sales-config.js
      - run: node --check commercial-extensions/iban-payment.js
      - run: node --check commercial-extensions/github-license-authority.js
      - run: node --test tests/multicurrency-github-license.test.js
