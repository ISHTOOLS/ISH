name: ISH Commercial Release Gate

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*-commercial'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax check commercial modules
        run: |
          node --check commercial-extensions/iban-payment.js
          node --check commercial-extensions/signed-license.js
          node --check release/build-commercial-release.mjs
      - name: Commercial licensing tests
        run: node --test tests/iban-payment-licensing.test.js
      - name: Full test suite
        run: npm test
      - name: Security regression tests
        run: npm run test:security
      - name: Dependency audit
        run: npm run audit:dependencies
      - name: Build commercial release
        env:
          ISH_RELEASE_VERSION: 1.3.0-commercial
        run: node release/build-commercial-release.mjs
      - name: Verify release manifest
        run: |
          test -s release/ishv4-real-kms-1.3.0-commercial/SHA256SUMS.txt
          test -s release/ishv4-real-kms-1.3.0-commercial/COMMERCIAL-RELEASE.txt
          test -f release/ishv4-real-kms-1.3.0-commercial/commercial-extensions/iban-payment.js
          test -f release/ishv4-real-kms-1.3.0-commercial/commercial-extensions/signed-license.js
      - name: Upload commercial artifact
        uses: actions/upload-artifact@v4
        with:
          name: ish-commercial-release-1.3.0
          path: release/ishv4-real-kms-1.3.0-commercial/
          if-no-files-found: error
          retention-days: 30
